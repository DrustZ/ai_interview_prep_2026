<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="my_interview_prep 本地资料的分页索引。" />
    <meta name="color-scheme" content="light dark" />
    <title>本地资料索引 · 前沿面试资料库</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("acre3points:theme:v1");
          const preferred = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = saved || preferred;
        } catch (_) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="materials-page">
    <a class="skip-link" href="#materials-list">跳到资料列表</a>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="返回题目库">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span><strong>本地资料索引</strong><small>MY_INTERVIEW_PREP ARCHIVE</small></span>
        </a>
        <div class="header-actions">
          <a class="header-library-link" href="./">← 返回题目库</a>
          <span class="snapshot-badge ready"><span class="status-dot" aria-hidden="true"></span><span id="materials-status">正在读取索引</span></span>
          <button class="icon-button" id="materials-theme" type="button" aria-label="切换深浅色主题"><span aria-hidden="true">◐</span></button>
        </div>
      </div>
    </header>

    <main class="materials-shell" id="materials-list">
      <section class="materials-intro" aria-labelledby="materials-title">
        <div>
          <div class="eyebrow"><span></span> LOCAL SOURCE MAP</div>
          <h1 id="materials-title">所有本地资料，按阅读单元整理。</h1>
          <p>大文档按章节拆分，Deep-ML 按题目打包，论坛 HTML 按原帖归档；每条都保留源文件和关联题目。</p>
        </div>
        <dl class="materials-stats" aria-label="本地资料统计">
          <div><dt id="material-stat-files">—</dt><dd>物理文件</dd></div>
          <div><dt id="material-stat-units">—</dt><dd>阅读单元</dd></div>
          <div><dt id="material-stat-forum">—</dt><dd>本地原帖</dd></div>
          <div><dt id="material-stat-related">—</dt><dd>已关联题目</dd></div>
        </dl>
      </section>

      <section class="materials-panel" aria-labelledby="materials-results-title">
        <div class="materials-controls">
          <label class="main-search" for="materials-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" /></svg>
            <input id="materials-search" type="search" placeholder="搜索标题、正文、源文件或标签…" autocomplete="off" />
          </label>
          <label class="material-select"><span>公司</span><select id="materials-company"><option value="">全部</option></select></label>
          <label class="material-select"><span>类型</span><select id="materials-kind"><option value="">全部</option></select></label>
          <label class="material-related"><input id="materials-related" type="checkbox" /> 只看已关联题目</label>
          <label class="page-size-control"><span>每页</span><select id="materials-page-size"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select></label>
        </div>

        <div class="results-heading-row materials-heading-row">
          <div><span class="section-kicker">MATERIALS</span><h2 id="materials-results-title">全部本地资料</h2></div>
          <p class="result-count" id="materials-count" aria-live="polite">正在载入…</p>
        </div>

        <div class="question-list-table material-list" id="material-table" aria-live="polite"></div>
        <nav class="pagination" id="materials-pagination" aria-label="资料分页" hidden>
          <button class="pagination-step" id="materials-prev" type="button">← 上一页</button>
          <div class="pagination-pages" id="materials-pages"></div>
          <button class="pagination-step" id="materials-next" type="button">下一页 →</button>
        </nav>
      </section>
    </main>

    <dialog class="question-dialog material-dialog" id="material-dialog" aria-labelledby="material-detail-title">
      <div class="dialog-shell">
        <header class="dialog-header">
          <div class="dialog-heading"><div class="dialog-company-row"><span class="company-pill" id="material-detail-kind">—</span><span class="access-pill" id="material-detail-company">—</span></div><h2 id="material-detail-title">资料详情</h2></div>
          <button class="dialog-close" id="material-detail-close" type="button" aria-label="关闭资料详情">×</button>
        </header>
        <div class="dialog-body">
          <p class="material-detail-summary" id="material-detail-summary"></p>
          <section class="detail-section"><h3>源文件</h3><div id="material-detail-files" class="material-file-list"></div></section>
          <section class="detail-section" id="material-related-section"><h3>关联题目</h3><div id="material-detail-related" class="material-related-list"></div></section>
          <section class="detail-section"><h3>本地内容</h3><pre class="material-detail-content" id="material-detail-content"></pre></section>
        </div>
      </div>
    </dialog>

    <footer class="site-footer"><p>本地索引 · 不上传资料 · 每个阅读单元都可追溯到源文件</p><p id="materials-generated">更新时间：—</p></footer>
    <script type="module" src="./assets/materials.js"></script>
  </body>
</html>
